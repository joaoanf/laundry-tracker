<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laundry Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- For the phone -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#47a24a">

</head>
<body>

  <h1>🧺 Laundry Tracker v7</h1>

  <button id="newWashBtn">Nova Lavagem</button>

  <h2>Items</h2>

  <div id="addItemContainer">
  <input type="text" id="newItemInput" placeholder="Novo item..." />
  <button id="addItemBtn">Adicionar</button>
  </div>

  <ul id="itemList"></ul>

  <!-- Wash Modal -->
  <div id="washModal" class="modal hidden">
    <div class="modalContent">
        <h2>Selecionar items lavados</h2>

        <div class="dateRow">
          <label for="washDate">Data da lavagem:</label>
          <input type="date" id="washDate">
        </div>

        <div id="checklist"></div>

        <div class="modalButtons">
          <button id="cancelWash">Cancelar</button>
          <button id="saveWash">Guardar Lavagem</button>
        </div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="modal hidden">
    <div class="modalContent">
      <h2>Histórico de Lavagens</h2>
      <div id="historyList"></div>
      <button id="closeHistory">Fechar</button>
    </div>
  </div>
  
<!-- Button to open history -->
  <button id="openHistoryBtn" style="margin-top: 20px; background:#ee8f01;">Histórico de Lavagens</button>

  <!-- Button to export and import data -->
  <div class="buttonContainer" style="margin-top: 20px;">
    <button id="exportDataBtn" style="background:#607d8b;">Exportar Backup</button>
    <button id="importDataBtn" style="background:#9c27b0;">Importar Backup</button>
  </div>

<input type="file" id="importFileInput" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
